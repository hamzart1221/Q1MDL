name: Update stats

on:
  schedule:
    - cron: "17 10 * * *"
    - cron: "17 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python update_stats.py
      - name: Save new stats
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          mkdir -p data
          git add data
          git diff --cached --quiet || git commit -m "Stats update $(date -u +%F)"
          git push
